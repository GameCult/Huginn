[package]
name = "huginn-mind"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The organ's rule engine: storage, identity and admission of one instance's
# mind. Document shape, bounds, formats and keys come from `epiphany-pipeline`;
# the store comes from CultLib's Rust CultCache at the same rev Epiphany pins,
# so the leaf's wrappers and this crate's cache are one `cultcache-rs`. No
# network, no socket, no index: those are the daemon's (Cut 10, Cut 11).
[dependencies]
anyhow = "1"
chrono = "0.4.44"
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "a0813c6eed24d30bf88073ef615b633c77ebfcd6", package = "cultcache-rs" }
epiphany-pipeline = { git = "https://github.com/GameCult/Epiphany.git", rev = "9d3a3efd56b34893f8c124d3eeb2526326bac646", package = "epiphany-pipeline" }
rmp-serde = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

# `test-support` exposes `Mind::store_path_for`, a grammar-checked path
# accessor tests in other crates need to reach a raw store directly. It buys
# no runtime surface: gated `#[cfg(any(test, feature = "test-support"))]`, so
# it compiles only under `cargo test` in this crate or when a dependent's own
# dev-dependencies enable it (see huginn-daemon/Cargo.toml).
[features]
test-support = []
