[workspace]
members = [
    "crates/eureka-pipeline",
    "crates/huginn-mind",
    "crates/huginn-daemon",
    "crates/eureka-state",
    "crates/mind-body",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# The one CultLib revision the workspace speaks. Every crate inherits these
# entries; a bump is a change to this table and nowhere else.
[workspace.dependencies]
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "75188fdefa0b4baf131dbfd94e77d06a965f0cc6", package = "cultcache-rs" }
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "75188fdefa0b4baf131dbfd94e77d06a965f0cc6", package = "cultnet-rs" }
